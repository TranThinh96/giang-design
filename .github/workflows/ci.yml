name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Runs first and on its own: content edits committed from /keystatic touch
      # public/ without ever passing through a developer's machine, so this is
      # the only place an oversized upload gets caught.
      - name: Image budget
        run: npm run check:images

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
